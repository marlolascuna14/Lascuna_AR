<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut AR Scanner</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
    
    <style>
        body { margin: 0; background-color: #222; overflow: hidden; font-family: Arial, sans-serif; }
        
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: #222; color: white; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        h2 { margin-top: 20px; margin-bottom: 10px; }
        model-viewer { width: 100%; height: 50vh; background-color: #333; }
        .instructions { margin: 15px; text-align: center; padding: 0 20px; }
        .start-btn { 
            background-color: #007bff; color: white; border: none; border-radius: 50px; 
            padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5); margin-top: 10px; 
        }

        #scanner-ui {
            display: none; 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000; pointer-events: none; 
        }

        .top-pill {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); color: black;
            padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .scanner-frame {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 350px;
        }

        .corner { position: absolute; width: 40px; height: 40px; border: 4px solid white; border-radius: 8px; }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

        .scan-line {
            position: absolute; top: 0; left: 5%; width: 90%; height: 3px;
            background: #00ff00; box-shadow: 0 0 12px #00ff00;
            animation: scan 2s infinite linear alternate;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .bottom-buttons {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; pointer-events: auto; 
        }
        .action-btn {
            background: white; color: black; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div id="start-screen">
        <h2>Astronaut AR Scanner</h2>
        <model-viewer src="Astronaut.glb" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
        <div class="instructions">
            <p>1. Open the framed CTU logo or Hiro marker.<br>2. Click below, point your camera, and pinch to resize.</p>
        </div>
        <button class="start-btn" onclick="startAR()">📷 OPEN REAL CAMERA</button>
    </div>

    <div id="scanner-ui">
        <div class="top-pill">🔍 Point camera at the marker</div>
        <div class="scanner-frame">
            <div class="corner top-left"></div><div class="corner top-right"></div>
            <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
            <div class="scan-line"></div>
        </div>
        <div class="bottom-buttons">
            <!-- Replaced the dummy Camera button with a functional Close button -->
            <button class="action-btn" onclick="location.reload()">❌ Close Scanner</button>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false" gesture-detector>
        <a-marker type="pattern" url="ctu-logo1.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity gltf-model="Astronaut.glb" scale="1.5 1.5 1.5" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler="minScale: 0.25; maxScale: 10"></a-entity>
        </a-marker>
        <a-marker type="pattern" url="ctu-logo.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity gltf-model="Astronaut.glb" scale="1.5 1.5 1.5" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler="minScale: 0.25; maxScale: 10"></a-entity>
        </a-marker>
        <a-marker type="pattern" url="ctu-logo2.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity gltf-model="Astronaut.glb" scale="1.5 1.5 1.5" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler="minScale: 0.25; maxScale: 10"></a-entity>
        </a-marker>
        <a-marker preset="hiro" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity gltf-model="Astronaut.glb" scale="1.5 1.5 1.5" position="0 0.5 0" rotation="-90 0 0" class="clickable" gesture-handler="minScale: 0.25; maxScale: 10"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function startAR() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('scanner-ui').style.display = 'block';
        }
    </script>
</body>
</html>
