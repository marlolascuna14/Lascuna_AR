<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut AR Scanner</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; background-color: #222; color: white; font-family: Arial, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #start-screen { text-align: center; z-index: 10; position: absolute; width: 100%; }
        button { background-color: #007bff; color: white; border: none; border-radius: 50px; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); }
        #ar-container { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>Astronaut AR</h1>
        <p>Point your camera at a Hiro marker to see the astronaut.</p>
        <button onclick="startAR()">📷 OPEN REAL CAMERA</button>
    </div>

    <div id="ar-container"></div>

    <script>
        function startAR() {
            document.getElementById('start-screen').style.display = 'none';
            const arContainer = document.getElementById('ar-container');
            arContainer.style.display = 'block';
            arContainer.innerHTML = `
                <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
                    <a-marker preset="hiro">
                        <a-entity gltf-model="Astronaut.glb" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-entity>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>
            `;
        }
    </script>
</body>
</html>
