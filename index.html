<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut AR Scanner</title>
    
    <!-- Tool for the 3D Preview -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <!-- Tools for the Real Camera and Gestures -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
    
    <style>
        body { margin: 0; background-color: #222; color: white; font-family: Arial, sans-serif; overflow: hidden; }
        
        #start-screen { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; width: 100vw; position: absolute; z-index: 10; background-color: #222;
        }
        
        h2 { margin-top: 20px; margin-bottom: 10px; }
        
        /* The 3D Preview Window */
        model-viewer { width: 100%; height: 50vh; background-color: #333; }
        
        .instructions { margin: 15px; text-align: center; padding: 0 20px; }
        
        button { 
            background-color: #007bff; color: white; border: none; border-radius: 50px; 
            padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5); margin-top: 10px; 
        }
        
        #ar-container { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    
    <!-- First Screen: 3D Preview and Button -->
    <div id="start-screen">
        <h2>Astronaut AR Scanner</h2>
        
        <!-- Interactive 3D Model Preview -->
        <model-viewer src="Astronaut.glb" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
        
        <div class="instructions">
            <p>1. Open the CTU pattern image on another screen.<br>2. Click below, point your camera, and pinch to zoom.</p>
        </div>
        
        <button onclick="startAR()">📷 OPEN REAL CAMERA</button>
    </div>

    <!-- Second Screen: Hidden AR Camera (Activates on click) -->
    <div id="ar-container"></div>

    <script>
        function startAR() {
            // Hide the start screen
            document.getElementById('start-screen').style.display = 'none';
            
            // Turn on the AR camera and load the custom CTU pattern
            const arContainer = document.getElementById('ar-container');
            arContainer.style.display = 'block';
            arContainer.innerHTML = `
                <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false" gesture-detector>
                    
                    <!-- References your uploaded ctu-logo1.patt file -->
                    <a-marker type="pattern" url="ctu-logo1.patt" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
                        <a-entity 
                            gltf-model="Astronaut.glb" 
                            scale="0.5 0.5 0.5" 
                            position="0 0 0" 
                            rotation="-90 0 0"
                            class="clickable"
                            gesture-handler>
                        </a-entity>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>
            `;
        }
    </script>
</body>
</html>
